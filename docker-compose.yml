services:
  panto115:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panto115
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - homelab

networks:
  homelab:
    external: true
