version: "3.9"

services:
  panto115:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panto115
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
